name: meditour_app
description: A medical tourism application for European clients.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 国际化
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # HTTP 请求
  dio: ^5.3.0
  # 状态管理（根据你的选择）
  provider: ^6.0.5  # 或 riverpod: ^2.3.0
  # 路由管理
  go_router: ^17.0.1
  # UI 组件库
  flutter_screenutil: ^5.9.0  # 屏幕适配
  cached_network_image: ^3.2.3  # 图片缓存
  # 本地存储
  shared_preferences: ^2.2.0
  # 表单验证
  form_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # 字体配置（暂时注释，等待字体文件准备就绪）
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  
  # 多语言支持
  generate: true
  
  # 资源文件
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/