name: meditour_app
description: A multilingual China travel planning application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 国际化
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  # HTTP 请求
  dio: ^5.3.0
  # 状态管理（根据你的选择）
  provider: ^6.0.5  # 或 riverpod: ^2.3.0
  # 路由管理
  go_router: ^17.0.1
  # UI 组件库
  flutter_screenutil: ^5.9.0  # 屏幕适配
  cached_network_image: ^3.2.3  # 图片缓存
  # 本地存储
  shared_preferences: ^2.2.0
  # 表单验证
  form_validator: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # 字体：刻意不打包字体文件。
  # 四语文案包含中日韩字符，完整 CJK 字体通常 5–10MB，Web 端会显著拖慢首屏；
  # 只内置拉丁字体会让中文回退到系统字体，出现混排。因此统一使用各平台系统字体
  # （iOS/macOS PingFang、Android Noto、Windows 微软雅黑、Web 按语言回退），
  # assets/fonts/ 仅保留 .gitkeep 占位；后续如需品牌字体，应引入子集化字体再启用。
  
  # 多语言支持
  generate: true
  
  # 资源文件
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
